version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: lcit_meal_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: qlsa
      MYSQL_USER: lcit_user
      MYSQL_PASSWORD: lcit_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./lcit-meal-api/sql/qlsa.sql:/docker-entrypoint-initdb.d/01_qlsa.sql:ro
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data:
